<!DOCTYPE html>
<html>
<head>
    <title>Button Test</title>
</head>
<body>
    <h1>Testing Buttons</h1>

    <button onclick="testStart()">Test Start</button>
    <button onclick="testStop()">Test Stop</button>
    <button onclick="testEval()">Test Eval</button>
    <button onclick="testAuto()">Test Auto</button>

    <script>
        function testStart() {
            alert('Start button works!');
        }

        function testStop() {
            alert('Stop button works!');
        }

        function testEval() {
            alert('Eval button works!');
        }

        function testAuto() {
            alert('Auto button works!');
        }

        // Test that JavaScript is working
        console.log('JavaScript loaded successfully');
    </script>
</body>
</html>
